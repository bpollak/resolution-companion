appId: com.resolutioncompanion.app
---
# Run against an already launched, onboarded app. Each first tap must switch
# immediately; a second tap is intentionally not used as a recovery.
- extendedWaitUntil:
    visible: "Today, .*"
    timeout: 15000
- waitForAnimationToEnd
- tapOn: "Journey tab"
# Journey and Coach headers are the title alone, so each tab is confirmed
# by a control only that tab renders.
- extendedWaitUntil:
    visible: "Previous month"
    timeout: 10000
- tapOn: "Coach tab"
- extendedWaitUntil:
    visible: "What do you need help with?.*"
    timeout: 10000
- tapOn: "Today tab"
- extendedWaitUntil:
    visible: "Today, .*"
    timeout: 10000
