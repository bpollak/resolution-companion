appId: com.resolutioncompanion.app
---
# Fresh-install regression: AI Coach onboarding → Today daily
# loop → Journey → Coach (micro-note, weekly review) → paywall.
# Historical Journey/Coach behavior is covered after seeding by the focused
# engagement and Coach flows; a new plan must not pretend history exists.
# Selectors use .* suffixes: RN Pressables concatenate child text + icons
# into labels like "Start Your Journey, " and Maestro full-matches regexes.

- launchApp:
    clearState: true
- setOrientation: PORTRAIT

# --- Empty Today state → onboarding entry ---
- extendedWaitUntil:
    visible: "Start your journey.*"
    timeout: 20000
- takeScreenshot: 00-empty-today
- tapOn: "Start your journey.*"

# --- Coach creates one daily habit; approval follows a readable preview ---
- assertNotVisible: "Start with one habit"
- tapOn: "Build a plan with Coach"
- tapOn: "Agree and continue.*"
- extendedWaitUntil:
    notVisible: "Stop Coach response"
    timeout: 60000
- tapOn: "Message your onboarding coach"
- inputText: "I want to become a consistent reader. My one habit is read one page every day, Monday through Sunday, after breakfast. The small version is one sentence."
- tapOn: "Send message"
- extendedWaitUntil:
    notVisible: "Stop Coach response"
    timeout: 60000
- tapOn: "Preview my plan"
- extendedWaitUntil:
    visible: "Edit habit 1"
    timeout: 60000
- takeScreenshot: 02-plan-summary
- assertVisible: "Every day"
- assertVisible: "Start with 1 habit"
- tapOn: "Start with 1 habit"

# The requested habit is daily. Generated wording is not a selector contract.
- extendedWaitUntil:
    visible: "Mark .* complete"
    timeout: 20000
- takeScreenshot: 03-today-fresh
- tapOn: "Mark .* complete"
- extendedWaitUntil:
    visible: ".* completed. Undo.*"
    timeout: 10000
- takeScreenshot: 04-today-actions-done
- extendedWaitUntil:
    visible: "Keep the streak alive?.*"
    timeout: 10000
    optional: true
- tapOn:
    text: "Not now.*"
    optional: true

# --- Journey: fresh-plan identity and support surface ---
- extendedWaitUntil:
    visible:
      id: "tab-journey"
    timeout: 10000
- tapOn:
    id: "tab-journey"
- extendedWaitUntil:
    visible: "Becoming .*"
    timeout: 10000
- takeScreenshot: 05-journey-top

# --- Coach lobby: single conversation entry + micro-note drip ---
- tapOn:
    id: "tab-coach"
- extendedWaitUntil:
    visible: "Start a conversation with Coach"
    timeout: 15000
- takeScreenshot: 08-coach-lobby
- scrollUntilVisible:
    element:
      text: "60-second read.*"
    direction: DOWN
    timeout: 30000
- tapOn: "60-second read.*"
- takeScreenshot: 09-coach-micro-note

# --- Paywall (via stable Profile entry on every fresh plan) ---
- tapOn:
    id: "tab-today"
- tapOn: "Open profile and settings.*"
- scrollUntilVisible:
    element:
      text: "Upgrade to Premium.*"
    direction: DOWN
    timeout: 30000
- tapOn: "Upgrade to Premium.*"
- extendedWaitUntil:
    visible: "Upgrade to Premium"
    timeout: 15000
- runFlow:
    when:
      platform: iOS
    commands:
      - scrollUntilVisible:
          element:
            text: ".*24.99.*year.*"
          direction: DOWN
          timeout: 30000
      - takeScreenshot: 10-paywall-compare-table
      - scrollUntilVisible:
          element:
            text: "Monthly plan, .*"
          direction: DOWN
          timeout: 30000
          centerElement: true
          visibilityPercentage: 40
      - tapOn: "Monthly plan, .*"
      - assertVisible: ".*2.99.*month.*"
      - takeScreenshot: 11-paywall-monthly-price
- runFlow:
    when:
      platform: Android
    commands:
      # A sideloaded AAB has no Play entitlement context. The correct state is
      # a recoverable store-connection message, never placeholder pricing.
      - scrollUntilVisible:
          element:
            text: "We couldn't load subscription options from the store.*"
          direction: DOWN
          timeout: 30000
          centerElement: true
          visibilityPercentage: 40
      - assertVisible: "Retry"
      - takeScreenshot: 10-paywall-store-unavailable
# Run with: JAVA_HOME=/opt/homebrew/opt/openjdk@17 PATH="$JAVA_HOME/bin:$PATH:$HOME/.maestro/bin" \
#   DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer maestro test qa/maestro-regression.yaml
# (build + install first: npm run build:local:sim → tar -xzf → xcrun simctl install)
# Updated for the AI-only 1.4.0 flow. Native run evidence is documented separately; this YAML has not been executed.
