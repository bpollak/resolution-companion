appId: com.resolutioncompanion.app
name: later-bets-settings-surfaces
---
# Run with an existing free test persona, after the AI onboarding flow or
# fixture setup. These checks do not create or reset the user's plan.
# The year recap and witness entries live in Journey's "Stories & Support"
# section; Private iCloud Backup lives in Profile > Privacy & Data.
- launchApp
- runFlow:
    when:
      visible: "Dismiss milestone celebration.*"
    commands:
      - tapOn: "Dismiss milestone celebration.*"
- tapOn:
    id: "tab-journey"
- extendedWaitUntil:
    visible: "Previous month"
    timeout: 15000

# Both later-bet entries remain reachable (also at maximum Dynamic Type).
- scrollUntilVisible:
    element:
      text: "Someone in Your Corner.*"
    direction: DOWN
    timeout: 45000
    centerElement: true
- assertVisible: "The Year You Became.*"
- takeScreenshot: a11y-04-journey-later-bets

# Witness is explicit opt-in: name first, then the prompt switch becomes
# available. Sharing remains a user-initiated system share action.
- tapOn: "Someone in Your Corner.*"
- extendedWaitUntil:
    visible: "Witness name.*"
    timeout: 10000
- tapOn:
    text: "Witness name.*"
    index: 1
- inputText: "Maya"
- pressKey: Enter
- scrollUntilVisible:
    element:
      text: "Celebration prompts.*"
    direction: DOWN
    timeout: 30000
- tapOn:
    text: "Celebration prompts.*"
    point: "90%,50%"
- scrollUntilVisible:
    element:
      text: "Message preview.*Maya.*"
    direction: DOWN
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Share this week's celebration.*"
    direction: DOWN
    timeout: 30000
- takeScreenshot: a11y-05-witness-opt-in
- scrollUntilVisible:
    element:
      text: "Close witness settings.*"
    direction: UP
    timeout: 30000
- tapOn: "Close witness settings.*"

# Free users see only the opening card plus a Premium teaser; the rhythm,
# resilience, and closing cards must not leak. The teaser routes to the
# premium explanation.
- scrollUntilVisible:
    element:
      text: "The Year You Became.*"
    direction: DOWN
    timeout: 30000
    centerElement: true
- tapOn: "The Year You Became.*"
- extendedWaitUntil:
    visible: "Close year recap.*"
    timeout: 10000
- assertVisible: "See the full year story with Premium"
- swipe:
    direction: LEFT
- assertNotVisible: ".*% consistency across .*"
- assertNotVisible: "The plan bent with you.*"
- assertNotVisible: ".*still becoming.*"
- tapOn: "See the full year story with Premium"
- extendedWaitUntil:
    visible: "Upgrade to Premium.*"
    timeout: 15000
- takeScreenshot: a11y-07-year-recap-premium-gate
- tapOn: "Close"
- tapOn: "Close year recap.*"

# A simulator without an iCloud account must fail safely: the screen renders,
# explains the boundary, and exposes disabled backup/restore controls.
- tapOn:
    id: "tab-today"
- tapOn: "Open profile and settings.*"
- extendedWaitUntil:
    visible: "My plans.*"
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "Privacy & Data.*"
    direction: DOWN
    timeout: 30000
    centerElement: true
- tapOn: "Privacy & Data.*"
- scrollUntilVisible:
    element:
      text: "Private iCloud Backup.*"
    direction: DOWN
    timeout: 30000
- tapOn: "Private iCloud Backup.*"
- extendedWaitUntil:
    visible: "Your data, in your iCloud.*"
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "Sign in to iCloud to enable.*"
    direction: DOWN
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Back up now.*"
    direction: DOWN
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Restore from iCloud backup.*"
    direction: DOWN
    timeout: 30000
- takeScreenshot: a11y-06-private-backup-unavailable
- scrollUntilVisible:
    element:
      text: "Close private backup.*"
    direction: UP
    timeout: 30000
- tapOn: "Close private backup.*"
