appId: com.resolutioncompanion.app
---
# Run after qa/maestro-regression.yaml creates the plan (AI consent already
# granted there). This deliberately uses production AI, then verifies the
# response controls, saved contextual history, and preview-before-apply flow.

- launchApp
# The progress line and Ask Coach link show only while a habit is pending.
- runFlow: _pending-today.yaml
- extendedWaitUntil:
    # The always-visible progress line, e.g. "0 of 1 done today. Day 1 ..."
    visible: ".* done today.*"
    timeout: 20000
- tapOn: "Ask Coach.*"
- extendedWaitUntil:
    visible: "Coach"
    timeout: 10000
- assertVisible: "Today’s signal.*"
- scrollUntilVisible:
    element:
      text: "Help me.*"
    direction: DOWN
    timeout: 15000
    centerElement: true
- tapOn: "Help me.*"
- tapOn:
    text: "Agree and continue.*"
    optional: true
- extendedWaitUntil:
    visible: "AI coach: .+"
    timeout: 90000
# Response controls render once the stream completes, not on the first chunk.
- extendedWaitUntil:
    notVisible: "Stop Coach response"
    timeout: 90000
- assertVisible: "Copy coach response"
- assertVisible: "Mark coach response helpful"
- assertVisible: "Mark coach response not helpful"
- assertVisible: "Report this AI response"
- tapOn: "Copy coach response"
- tapOn: "Mark coach response helpful"
- tapOn: "Save coaching session"
- extendedWaitUntil:
    visible:
      id: "tab-coach"
    timeout: 15000

# The saved contextual session must be discoverable from the persistent lobby.
- tapOn:
    id: "tab-coach"
- scrollUntilVisible:
    element:
      text: "Past Sessions.*"
    direction: DOWN
    timeout: 15000
    centerElement: true
- extendedWaitUntil:
    visible: "Past Sessions.*"
    timeout: 15000
- assertVisible: ".*momentum.*"

# A plan change from Coach never mutates the plan until its preview is
# explicitly confirmed. On this day-one plan the change on offer is a next
# step: "Adjust my plan" waits for 7 scheduled days of history (1.7.0), and
# its preview/keep/apply path is exercised on the seeded plan in
# qa/maestro-coach-responsiveness.yaml.
- scrollUntilVisible:
    element:
      text: "Start a conversation with Coach"
    direction: UP
    timeout: 15000
    centerElement: true
- tapOn: "Start a conversation with Coach"
- scrollUntilVisible:
    element:
      text: "Help me add a next step"
    direction: DOWN
    timeout: 15000
    centerElement: true
- assertNotVisible: "Request a previewed plan adjustment"
- tapOn: "Help me add a next step"
- scrollUntilVisible:
    element:
      text: "Suggested next step"
    direction: DOWN
    timeout: 90000
    centerElement: true
- assertVisible: "Suggested: .*"
- assertVisible: "Not now. Save this step for later."
- assertVisible: "Add this step to my plan"
- tapOn: "Not now. Save this step for later."
- assertNotVisible: "Suggested next step"
- assertVisible: "Saved for later.*"

# Request a fresh step and exercise the apply path.
- tapOn: "Help me add a next step"
- scrollUntilVisible:
    element:
      text: "Suggested next step"
    direction: DOWN
    timeout: 90000
    centerElement: true
- tapOn: "Add this step to my plan"
- assertNotVisible: "Suggested next step"
- extendedWaitUntil:
    visible: "AI coach: Added to your plan: .*"
    timeout: 10000
- tapOn: "Close Coach"
