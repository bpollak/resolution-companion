appId: com.resolutioncompanion.app
---
# Remaining engagement items: micro-note expand (asserted via the card's
# Expand→Collapse label change), live weekly-review coach session, and the
# opt-in Dawn switch turned on and back to midnight through the UI.

- launchApp

# Seeded history completes a milestone on launch, firing the completion
# celebration (with the Dawn-theme unlock reveal). Dismiss it to reach Today.
# Optional + repeated so the flow is robust whether one or several fire, or
# none (already seen on a prior launch).
- repeat:
    times: 3
    commands:
      - tapOn:
          text: "Dismiss milestone celebration.*"
          optional: true
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Becoming My Future Self.*"
    timeout: 20000
- tapOn:
    id: "tab-coach"
- waitForAnimationToEnd

# --- Micro-note: expand, verified by the accessibility state flip ---
- scrollUntilVisible:
    element:
      text: "60-second read.*"
    direction: DOWN
    timeout: 30000
    centerElement: true
- tapOn: "60-second read.*"
- waitForAnimationToEnd
- assertVisible: "60-second read.*Collapse.*"
- takeScreenshot: 16-micro-note-expanded
- scrollUntilVisible:
    element:
      text: "Start a conversation.*"
    direction: UP
    timeout: 30000
    centerElement: true

# --- Live weekly review via the sheet's review chip ---
- tapOn: "Start a conversation with Coach"
- extendedWaitUntil:
    visible: "Help me review one win and one point of friction from last week.*"
    timeout: 15000
- tapOn: "Help me review one win and one point of friction from last week.*"
# In the contextual sheet, AI consent is requested at send time (not on open)
- tapOn:
    text: "Agree and continue.*"
    optional: true
- extendedWaitUntil:
    # Match a non-empty coach bubble. The old week regex matched the static
    # "Weekly Review" title while the response was still spinning.
    visible: "AI coach: .+"
    timeout: 90000
- takeScreenshot: 17-weekly-review-live
# Wait for the completed turn: a Save while still streaming has nothing in
# the transcript to keep yet. The response controls render only once the
# stream ends. (A trailing "?" was used before, but the model does not always
# end on a question.)
- extendedWaitUntil:
    notVisible: "Stop Coach response"
    timeout: 90000
- assertVisible: "Copy coach response"
- tapOn: "Save coaching session"
- extendedWaitUntil:
    visible:
      id: "tab-today"
    timeout: 15000

# --- Dawn: the unlocked reward is opt-in. Turn it on, then back to midnight
# through the UI, asserting the switch state each time (the old flow tapped
# once and assumed the unlock had already applied Dawn; it does not). ---
- tapOn:
    id: "tab-today"
- waitForAnimationToEnd
- tapOn: "Open profile and settings.*"
- extendedWaitUntil:
    # Post-AI-session modal presentation can lag; give it headroom
    visible: "My plans.*"
    timeout: 20000
# Earned rewards live in the dedicated Appearance panel
- scrollUntilVisible:
    element:
      text: "Appearance.*"
    direction: DOWN
    timeout: 30000
    centerElement: true
- tapOn: "Appearance.*"
- scrollUntilVisible:
    element:
      text: "Dawn Theme.*"
    direction: DOWN
    timeout: 30000
    centerElement: true
- waitForAnimationToEnd
- assertVisible:
    text: "Toggle Dawn Theme"
    checked: false
- tapOn: "Toggle Dawn Theme"
- waitForAnimationToEnd
- assertVisible:
    text: "Toggle Dawn Theme"
    checked: true
- takeScreenshot: 18-profile-dawn-on
- tapOn: "Back to profile.*"
- tapOn: "Close profile.*"
- takeScreenshot: 18b-today-dawn
- tapOn: "Open profile and settings.*"
- scrollUntilVisible:
    element:
      text: "Appearance.*"
    direction: DOWN
    timeout: 30000
    centerElement: true
- tapOn: "Appearance.*"
- tapOn: "Toggle Dawn Theme"
- waitForAnimationToEnd
- assertVisible:
    text: "Toggle Dawn Theme"
    checked: false
- takeScreenshot: 19-profile-back-to-midnight
- tapOn: "Back to profile.*"
- tapOn: "Close profile.*"
- takeScreenshot: 20-today-midnight-restored
